<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myths of Hasthar</title>
<style>
  :root{
    --soil:      #14100c;
    --soil-2:    #1d1712;
    --parchment: #e9dcb8;
    --gold:      #b98a2e;
    --gold-dim:  #7a5d21;
    --rust:      #8c3a2b;
    --moss:      #3f5c46;
    --green:     #39d67a;
    --ink:       #dcd0ab;
    --line:      #3a2f22;
    --display: 'Cinzel', 'Times New Roman', serif;
    --body: 'EB Garamond', Georgia, serif;
    --mono: 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--soil); color:var(--ink); font-family:var(--body);
    padding:20px 14px 60px;
  }
  .wrap{max-width:980px; margin:0 auto;}
  .title-banner{
    text-align:center; margin-bottom:22px; padding:18px 10px; background:linear-gradient(180deg,#2a0f0d,#1d0a08);
    border:1px solid var(--line); border-radius:4px;
  }
  .title-banner h1{
    font-family:var(--display); letter-spacing:.08em; color:var(--parchment); font-size:1.9rem; margin:0 0 4px;
    text-shadow:0 0 18px rgba(185,138,46,.35);
  }
  .title-banner .tagline{color:var(--gold); font-size:.8rem; letter-spacing:.15em; text-transform:uppercase;}
  .title-banner .logo-img{display:block; width:min(640px, 92%); height:auto; margin:0 auto 10px; border-radius:2px;}
  .sep{border:none; border-top:1px solid var(--line); margin:22px 0;}

  .big-btn{
    font-family:var(--mono); background:transparent; color:var(--parchment);
    border:1px solid var(--gold-dim); padding:12px 22px; margin:6px; cursor:pointer;
    letter-spacing:.06em; font-size:.82rem; text-transform:uppercase; transition:.15s; border-radius:2px;
  }
  .big-btn:hover{background:var(--gold-dim); color:var(--soil);}
  .big-btn:disabled{opacity:.35; cursor:not-allowed;}
  .big-btn.safe{border-color:var(--moss);} .big-btn.safe:hover{background:var(--moss); color:var(--parchment);}
  .big-btn.danger{border-color:var(--rust);} .big-btn.danger:hover{background:var(--rust); color:var(--parchment);}
  .big-btn.gold{border-color:var(--gold);} .big-btn.gold:hover{background:var(--gold); color:var(--soil);}
  .big-btn.small{padding:7px 14px; font-size:.72rem; margin:4px;}
  .center{text-align:center;}

  .market-panel{
    text-align:center; background:var(--soil-2); border:1px dashed var(--gold-dim); border-radius:4px;
    padding:8px 12px; margin-bottom:16px;
  }
  .market-label{
    display:block; font-family:var(--mono); font-size:.72rem; color:var(--gold-dim); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:4px;
  }

  .card-count-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:18px 0;}
  .card-count-box{
    background:var(--soil-2); border:1px solid var(--line); padding:14px 18px; text-align:center; min-width:130px;
  }
  .card-count-box label{display:block; font-family:var(--display); letter-spacing:.05em; color:var(--gold); font-size:.78rem; margin-bottom:8px; text-transform:uppercase;}
  .card-count-box input{
    width:70px; background:var(--soil); border:1px solid var(--gold-dim); color:var(--parchment);
    font-family:var(--mono); font-size:1.1rem; text-align:center; padding:6px;
  }
  .count-total{text-align:center; font-family:var(--mono); color:var(--gold-dim); font-size:.85rem; margin-top:4px;}
  .count-total.bad{color:var(--rust);}

  .pass-gate{
    text-align:center; padding:60px 20px; background:var(--soil-2); border:1px solid var(--line); border-radius:4px;
  }
  .pass-gate h2{font-family:var(--display); color:var(--gold); letter-spacing:.08em; font-size:1.3rem; margin-bottom:10px;}
  .pass-gate p{color:var(--ink); font-size:.9rem; max-width:440px; margin:0 auto 22px;}

  .reveal-hand{text-align:center;}
  .reveal-hand h2{font-family:var(--display); color:var(--gold); letter-spacing:.08em; font-size:1.2rem; margin-bottom:6px;}
  .reveal-hand .sub{color:var(--gold-dim); font-size:.82rem; margin-bottom:20px;}
  .peek-cards{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;}
  .peek-card{width:110px;}
  .peek-card img{width:100%; border-radius:6px; border:1px solid var(--line); display:block;}
  .peek-card .lbl{text-align:center; font-family:var(--mono); font-size:.68rem; color:var(--gold-dim); margin-top:4px; text-transform:uppercase;}
  .extras-note{
    background:var(--soil-2); border:1px dashed var(--gold-dim); padding:12px 16px; max-width:520px; margin:0 auto 22px;
    font-size:.82rem; color:var(--ink); text-align:left; border-radius:4px;
  }

  .turn-banner{
    text-align:center; font-family:var(--display); letter-spacing:.1em; color:var(--gold); font-size:1.05rem;
    margin-bottom:16px; padding:10px; background:var(--soil-2); border:1px solid var(--line);
  }
  .supply-bar{
    text-align:center; font-family:var(--mono); font-size:.78rem; color:var(--gold-dim); margin-bottom:20px;
  }
  .supply-bar img{width:14px; height:14px; vertical-align:middle; border-radius:2px; margin:0 3px 0 8px; object-fit:cover;}

  .board{display:flex; flex-direction:column; gap:14px; margin-bottom:20px;}
  .row-panel{
    background:var(--soil-2); border:1px solid var(--line); padding:14px; border-radius:4px; transition:.2s;
  }
  .row-panel.active-turn{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-dim) inset;}
  .row-panel.eliminated-row{opacity:.55;}
  .row-panel .rp-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;
  }
  .rp-name{font-family:var(--display); letter-spacing:.06em; color:var(--gold); font-size:.95rem;}
  .rp-tag{
    font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; padding:2px 6px; margin-left:8px;
    border:1px solid var(--line); color:var(--ink); text-transform:uppercase;
  }
  .rp-tag.eliminated{color:var(--rust); border-color:var(--rust);}
  .rp-tag.you-turn{color:var(--gold); border-color:var(--gold);}
  .rp-res{display:flex; gap:14px; font-family:var(--mono); font-size:.78rem; flex-wrap:wrap;}
  .rp-res .val{display:flex; align-items:center; gap:5px; color:var(--parchment);}
  .rp-res .val img{width:15px; height:15px; border-radius:2px; object-fit:cover;}

  .slots{display:flex; gap:10px; flex-wrap:wrap;}
  .slot{
    width:120px; height:180px; border-radius:7px; overflow:hidden; position:relative;
    border:2px solid var(--line); background:var(--soil); transition:.25s;
  }
  .slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .slot.empty-slot{border-style:dashed; opacity:.3;}
  .slot.picking{
    border-color:var(--green); box-shadow:0 0 14px 2px rgba(57,214,122,.65); animation:pulseGreen 0.9s ease-in-out infinite;
  }
  @keyframes pulseGreen{
    0%,100%{box-shadow:0 0 8px 1px rgba(57,214,122,.5);}
    50%{box-shadow:0 0 20px 5px rgba(57,214,122,.9);}
  }
  .slot.just-resolved{border-color:var(--gold);}
  .slot.selectable{cursor:pointer; border-color:var(--gold-dim); box-shadow:0 0 0 1px var(--gold-dim) inset;}
  .slot.selectable:hover{border-color:var(--gold); box-shadow:0 0 12px 2px rgba(185,138,46,.6);}
  .slot.own-card img{filter:none;}
  .ai-thinking{opacity:.75; font-style:italic;}

  .resolution-panel{
    background:var(--soil-2); border:1px solid var(--gold-dim); padding:18px; text-align:center; border-radius:4px; margin-bottom:20px;
  }
  .resolution-panel .rp-title{font-family:var(--display); letter-spacing:.08em; color:var(--gold); font-size:1rem; margin-bottom:10px;}
  .resolution-panel .rp-msg{color:var(--ink); font-size:.9rem; margin-bottom:16px; line-height:1.5;}
  .resolution-panel img.reveal-card{width:100px; border-radius:6px; margin-bottom:14px; border:1px solid var(--line);}

  .log-title{font-family:var(--display); font-size:.75rem; letter-spacing:.2em; color:var(--gold-dim); margin:26px 0 8px;}
  .log{
    background:var(--soil-2); border:1px solid var(--line); padding:14px 16px;
    max-height:220px; overflow-y:auto; font-family:var(--mono); font-size:.76rem; line-height:1.7;
  }
  .log div{border-bottom:1px dashed var(--line); padding:3px 0;}
  .log div:last-child{border-bottom:none;}
  .log .turn-marker{color:var(--gold); margin-top:6px; font-family:var(--display); letter-spacing:.06em;}

  .winner-banner{
    text-align:center; font-family:var(--display); letter-spacing:.12em; color:var(--gold); font-size:1.3rem;
    padding:26px 14px; background:linear-gradient(180deg,#2a0f0d,#1d0a08); border:1px solid var(--gold-dim); margin-bottom:18px;
    border-radius:4px;
  }
  .final-table{width:100%; border-collapse:collapse; margin-bottom:20px; font-family:var(--mono); font-size:.82rem;}
  .final-table th, .final-table td{border:1px solid var(--line); padding:8px 10px; text-align:center;}
  .final-table th{color:var(--gold); background:var(--soil-2);}
  .stats-table{margin-bottom:14px; font-size:.76rem;}

  .chart-wrap{
    background:var(--soil-2); border:1px solid var(--line); border-radius:4px; padding:14px 14px 10px;
    margin-bottom:8px;
  }
  .chart-title{
    font-family:var(--display); font-size:.72rem; letter-spacing:.18em; color:var(--gold-dim);
    text-align:center; margin-bottom:8px;
  }
  .gold-chart{width:100%; height:auto; display:block;}
  .chart-grid{stroke:var(--line); stroke-width:1;}
  .chart-axis{stroke:var(--gold-dim); stroke-width:1;}
  .chart-tick{font-family:var(--mono); font-size:9px; fill:var(--gold-dim);}
  .chart-axis-label{font-family:var(--mono); font-size:10px; fill:var(--gold-dim); letter-spacing:.05em;}
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
  .chart-legend-item{
    font-family:var(--mono); font-size:.72rem; color:var(--ink); display:inline-flex; align-items:center; gap:6px;
  }
  .chart-swatch{width:10px; height:10px; border-radius:2px; display:inline-block;}
  .chart-empty{
    text-align:center; font-family:var(--mono); font-size:.78rem; color:var(--gold-dim); padding:20px;
  }

  .assump-note{
    background:var(--soil-2); border:1px dashed var(--gold-dim); padding:12px 16px; font-size:.78rem;
    color:var(--gold-dim); margin-top:26px; border-radius:4px;
  }
  h3.section-h{font-family:var(--display); letter-spacing:.1em; color:var(--gold); font-size:.9rem; margin:20px 0 10px;}
  p.rules-p{font-size:.88rem; line-height:1.6;}
  .rules-card-row{display:flex; gap:14px; align-items:flex-start; margin-bottom:18px;}
  .rules-card-row img{width:80px; border-radius:6px; flex-shrink:0;}

  footer.foot{text-align:center; margin-top:30px; color:var(--gold-dim); font-family:var(--mono); font-size:.7rem; letter-spacing:.08em;}
</style>
</head>

const DISPLAY_NAME = { Hasthar:'Hasthar', Burglar:'Burglar', Goddess:'Goddess', SacredLine:'Sacred Line' };

/* =====================================================================
   MYTHS OF HASTHAR — TEMPLE MODE (human vs. 2 computer players)
   A hidden-memory, push-your-luck variant inspired by, not identical
   to, "Temple of Schrecken"-style deduction games.

   Player 1 is always the real player: their own five cards stay face
   up on the board the whole game (no need to memorize), while the two
   computer players' rows stay face down. On Player 1's turn, THEY pick
   which face-down card to draw. On a computer player's turn, it picks
   randomly. A green glow always marks the exact card being drawn.

   ASSUMPTIONS MADE WHERE THE SPEC WAS OPEN (also shown in-game under
   Rules):
   1. Effects resolve against the DRAWER (whoever's turn it is):
      Hasthar threatens the drawer, Burglar lets the ROW OWNER steal
      from the drawer, Goddess blesses the drawer.
   2. Hasthar drawn with no Flour Doll and no Sacred Line available =
      elimination (can't take turns again, but their row stays live).
   3. Computer players, when they draw a Hasthar themselves, always
      prefer a free Sacred Line block over sacrificing a Flour Doll,
      and only run out of options if they hold neither.
   4. Game ends once all 15 cards are drawn; most Gold Coins wins.
   5. Sacred Line is private and single-use — spent the moment it
      blocks a Hasthar, regained only via a new Goddess blessing.
   ===================================================================== */

let S = { screen: 'start' };

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function isHuman(p){ return p === S.human; }

/* ===================== SETUP ===================== */
let pendingCounts = { Burglar: 8, Hasthar: 5, Goddess: 2 };
let pendingStartRes = { gold: 1, dolls: 1, sacredLines: 1 };

/* Archive of every game completed this browser session (outside S, so it
   survives "New Game" resets). Each entry is just { players, turns,
   finalGold } — recorded once, when a game ends — and feeds the
   games-played count and the turns-vs-gold scatter in the Game Log. */
let gameArchive = [];

function goToSetup(){ S = { screen: 'setup' }; render(); }

function updateCount(card, val){
  pendingCounts[card] = Math.max(0, parseInt(val, 10) || 0);
  render();
}
function updateStartRes(key, val){
  pendingStartRes[key] = Math.max(0, parseInt(val, 10) || 0);
  render();
}
function totalCount(){
  return pendingCounts.Burglar + pendingCounts.Hasthar + pendingCounts.Goddess;
}

function dealNewGame(){
  const numPlayers = 3;
  const total = totalCount();
  if (total !== numPlayers * 5) return;

  const players = Array.from({ length: numPlayers }, (_, i) => `Player ${i + 1}`);
  const human = players[0];
  let deck = [];
  for (const [card, n] of Object.entries(pendingCounts)) for (let i = 0; i < n; i++) deck.push(card);
  deck = shuffle(deck);

  const rows = {};
  players.forEach(p => { rows[p] = deck.splice(0, 5); });
  const consumed = {};
  players.forEach(p => { consumed[p] = rows[p].map(() => false); });

  S = {
    screen: 'board',
    numPlayers, players, human,
    rows, consumed,
    discard: [],
    drawCount: 0,
    deckCounts: { ...pendingCounts },
    drawnCounts: { Hasthar: 0, Burglar: 0, Goddess: 0 },
    gold: Object.fromEntries(players.map(p => [p, pendingStartRes.gold])),
    dolls: Object.fromEntries(players.map(p => [p, pendingStartRes.dolls])),
    sacredLines: Object.fromEntries(players.map(p => [p, pendingStartRes.sacredLines])),
    status: Object.fromEntries(players.map(p => [p, 'active'])),
    turnIndex: 0,
    pending: null,
    winner: null,
    log: []
  };
  logMsg(`— New game. You are Player 1. Greed pile: ${pendingCounts.Hasthar} Hasthar, ${pendingCounts.Burglar} Burglar, ${pendingCounts.Goddess} Goddess (15 cards, 5 dealt to each). Every player starts with ${pendingStartRes.sacredLines} Sacred Line, ${pendingStartRes.gold} Gold Coin, ${pendingStartRes.dolls} Flour Doll. Your hand stays face up the whole game — the computer players' hands stay hidden. —`, true);
  render();
  maybeAutoAdvance();
}

function logMsg(msg, marker=false){ S.log.push({ msg, marker }); }

/* ===================== TURN ENGINE ===================== */
function eligibleTargets(activePlayer){
  const targets = [];
  S.players.forEach(owner => {
    if (owner === activePlayer) return;
    S.consumed[owner].forEach((done, idx) => { if (!done) targets.push({ owner, idx }); });
  });
  return targets;
}
function totalRemaining(){
  return S.players.reduce((sum, p) => sum + S.consumed[p].filter(c => !c).length, 0);
}
function nextActiveIndex(fromIdx){
  for (let i = 1; i <= S.players.length; i++){
    const idx = (fromIdx + i) % S.players.length;
    if (S.status[S.players[idx]] === 'active') return idx;
  }
  return null;
}
function activePlayers(){
  return S.players.filter(p => S.status[p] === 'active');
}
function noActivePlayersLeft(){
  return activePlayers().length === 0;
}
/* Cards no longer vanish for good — once every card in a row has been
   drawn, that row is reshuffled back to life from the discard pile (see
   refillEmptyRows()). That means the pile rarely empties out on its own,
   so as a safety valve the temple also settles the score after a very
   long stretch of play. */
const DRAW_HARD_CAP = 150;

function checkGameOver(){
  const remaining = totalRemaining();
  const allGone = remaining === 0;
  const allEliminated = noActivePlayersLeft();
  // With only one active player left, every other row was emptied out by
  // eliminatePlayer() and never gets refilled — so that lone survivor can
  // never have an eligible target again. Without this check the turn
  // engine would loop forever trying (and failing) to find them one.
  const soleSurvivor = !allGone && !allEliminated && activePlayers().length === 1;
  const exhausted = (S.drawCount || 0) >= DRAW_HARD_CAP;

  if (allGone || allEliminated || soleSurvivor || exhausted){
    let best = S.players[0];
    S.players.forEach(p => { if (S.gold[p] > S.gold[best]) best = p; });
    const tied = S.players.filter(p => S.gold[p] === S.gold[best]);
    S.winner = tied.length > 1 ? tied : best;
    S.screen = 'end';
    // One entry per finished game — its total turn count against each
    // SURVIVING player's final Gold Coin tally (eliminated players are
    // left out; they didn't make it to a "final" gold count that means
    // anything). Recorded only once the game is actually over, and never
    // touched again after that.
    gameArchive.push({
      survivors: S.players.filter(p => S.status[p] === 'active'),
      turns: S.drawCount,
      finalGold: { ...S.gold }
    });
    if (soleSurvivor){
      logMsg(`★ ${activePlayers()[0]} is the last one left standing — the temple yields to them. ★`, true);
    } else if (exhausted && !allGone && !allEliminated){
      logMsg(`★ The temple grows exhausted after ${S.drawCount} draws — the count is settled here. ★`, true);
    } else {
      logMsg(`★ The temple falls silent. ★`, true);
    }
    return true;
  }
  return false;
}

/* Advances the turn, skipping eliminated players and auto-skipping a
   player with no eligible targets. Then, if the new active player is
   a computer, schedules its automatic draw. */
function advanceTurn(){
  if (checkGameOver()){ render(); return; }
  const next = nextActiveIndex(S.turnIndex);
  if (next === null){ checkGameOver(); render(); return; }
  S.turnIndex = next;
  const active = S.players[S.turnIndex];
  if (eligibleTargets(active).length === 0){
    logMsg(`${active} has no other player's cards left to draw from — turn skipped.`);
    advanceTurn();
    return;
  }
  render();
  maybeAutoAdvance();
}

/* Computer players use the market too: before drawing, a computer player
   with no Sacred Line buys one first (a free block against the next
   Hasthar is worth more than anything else 2 Gold Coins can buy), then
   tops up a missing Flour Doll the same way, as long as it can afford
   MARKET_COST each time. It never buys past having 1 of each — it's
   playing safe, not stockpiling. */
function aiMaybeBuy(p){
  let bought = false;
  while (S.gold[p] >= MARKET_COST && S.sacredLines[p] < 1){
    S.gold[p] -= MARKET_COST;
    S.sacredLines[p] += 1;
    logMsg(`${p} spends ${MARKET_COST} Gold Coins at the market for 1 ${RESOURCE_LABEL.sacredLines}.`);
    bought = true;
  }
  while (S.gold[p] >= MARKET_COST && S.dolls[p] < 1){
    S.gold[p] -= MARKET_COST;
    S.dolls[p] += 1;
    logMsg(`${p} spends ${MARKET_COST} Gold Coins at the market for 1 ${RESOURCE_LABEL.dolls}.`);
    bought = true;
  }
  return bought;
}

function maybeAutoAdvance(){
  if (S.screen !== 'board' || S.pending) return;
  const active = S.players[S.turnIndex];
  if (S.status[active] !== 'active') { advanceTurn(); return; }
  if (!isHuman(active)){
    if (aiMaybeBuy(active)) render();
    setTimeout(() => { aiDrawCard(); }, 750);
  }
}

/* Begin drawing `target` ({owner, idx}) on behalf of `drawer`. Shared
   by both the human's manual click and the computer's random pick. */
function beginDraw(drawer, target){
  S.pending = { phase: 'highlight', drawer, owner: target.owner, idx: target.idx };
  render();

  setTimeout(() => {
    if (!S.pending) return;
    const p = S.pending;
    p.phase = 'revealed';
    p.card = S.rows[p.owner][p.idx];

    if (!pauseForHuman(p)){
      // Nobody human needs to decide anything here (either it's two
      // computer players, or the human is involved but has no real choice
      // to make) — resolve immediately and log it right away so the
      // ledger captures every such resolution.
      applyResolution(p);
      logMsg(p.outcomeMsg);
      render();
      setTimeout(() => { finishResolution(); }, 1200);
      return;
    }

    if (p.card === 'Goddess'){
      // No real decision either way — resolve now, human just acknowledges.
      applyResolution(p);
    }
    render();
  }, 900);
}

function humanChooseTarget(owner, idx){
  if (S.pending) return;
  const active = S.players[S.turnIndex];
  if (active !== S.human || S.status[active] !== 'active') return;
  beginDraw(active, { owner, idx });
}

function aiDrawCard(){
  const active = S.players[S.turnIndex];
  if (S.status[active] !== 'active'){ advanceTurn(); return; }
  const targets = eligibleTargets(active);
  if (targets.length === 0){
    logMsg(`${active} has no other player's cards left to draw from — turn skipped.`);
    advanceTurn();
    return;
  }
  const pick = targets[Math.floor(Math.random() * targets.length)];
  beginDraw(active, pick);
}

const RESOURCE_LABEL = { gold: 'Gold Coin', dolls: 'Flour Doll', sacredLines: 'Sacred Line' };

/* Whether the human player has a real (or forced-acknowledgement) decision
   to make for the current pending reveal. Hasthar's decision belongs to
   the DRAWER (do they feed a Doll or spend a Sacred Line?); Burglar's
   decision belongs to the ROW OWNER (what do they steal?); Goddess never
   involves a decision either way. */
function pauseForHuman(p){
  const { card, drawer, owner } = p;
  if (card === 'Hasthar') return isHuman(drawer);
  if (card === 'Burglar') return isHuman(owner);
  if (card === 'Goddess') return isHuman(drawer);
  return false;
}

/* Applies the game effect for the current S.pending reveal automatically
   (used whenever no human decision is required — see pauseForHuman()).
   Sets p.outcomeMsg for display. Does NOT touch S.consumed or advance the
   turn — finishResolution() does that. */
function applyResolution(p){
  const { drawer, owner, card } = p;
  if (card === 'Hasthar'){
    if (S.sacredLines[drawer] > 0){
      S.sacredLines[drawer] -= 1;
      p.outcomeMsg = `${drawer} invokes a Sacred Line — Hasthar's threat is extinguished. The Sacred Line is spent; nobody gains anything.`;
    } else if (S.dolls[drawer] > 0){
      S.dolls[drawer] -= 1;
      S.gold[owner] += 1;
      p.outcomeMsg = `${drawer} feeds Hasthar a Flour Doll — ${owner}, whose Hasthar it was, receives 1 Gold Coin.`;
    } else {
      const info = eliminatePlayer(drawer, owner);
      p.outcomeMsg = `${drawer} has no Flour Doll and no Sacred Line to offer — ELIMINATED by Hasthar. ${owner} inherits everything they held (+${info.g} Gold, +${info.d} Doll${info.d===1?'':'s'}, +${info.s} Sacred Line${info.s===1?'':'s'}), and ${drawer}'s remaining ${info.discardedCount} card${info.discardedCount===1?'':'s'} ${info.discardedCount===1?'is':'are'} discarded.`;
    }
  } else if (card === 'Burglar'){
    const choice = aiBurglarChoice(drawer);
    if (choice){
      S[choice][drawer] -= 1;
      S[choice][owner] += 1;
      p.outcomeMsg = `${owner}'s Burglar strikes! Steals 1 ${RESOURCE_LABEL[choice]} from ${drawer}.`;
    } else {
      p.outcomeMsg = `${owner}'s Burglar strikes, but ${drawer} has nothing worth stealing — the attempt is wasted.`;
    }
  } else if (card === 'Goddess'){
    S.sacredLines[drawer] += 1;
    S.gold[drawer] += 1;
    S.dolls[drawer] += 1;
    p.outcomeMsg = `${drawer} is blessed by the Goddess: +1 Sacred Line, +1 Gold Coin, +1 Flour Doll.`;
  }
}

/* Computer heuristic for a Burglar's row owner: prefer the drawer's Gold
   Coins (direct win-condition value), then a Sacred Line (denies future
   protection), then a Flour Doll. Returns null if the drawer has nothing
   at all worth stealing. */
function aiBurglarChoice(drawer){
  if (S.gold[drawer] > 0) return 'gold';
  if (S.sacredLines[drawer] > 0) return 'sacredLines';
  if (S.dolls[drawer] > 0) return 'dolls';
  return null;
}

/* Human's own choice when THEY are the drawer of a Hasthar. */
function resolveHasthar_sacrifice(){
  const p = S.pending; const { drawer, owner } = p;
  S.dolls[drawer] -= 1; S.gold[owner] += 1;
  logMsg(`${drawer} feeds Hasthar a Flour Doll — ${owner}, whose Hasthar it was, receives 1 Gold Coin.`);
  finishResolution();
}
function resolveHasthar_sacredLine(){
  const p = S.pending; const { drawer } = p;
  S.sacredLines[drawer] -= 1;
  logMsg(`${drawer} invokes a Sacred Line — Hasthar's threat is extinguished. The Sacred Line is spent; nobody gains anything.`);
  finishResolution();
}
function resolveHasthar_noProtection(){
  const p = S.pending; const { drawer, owner } = p;
  const info = eliminatePlayer(drawer, owner);
  logMsg(`${drawer} has no Flour Doll and no Sacred Line to offer — ELIMINATED by Hasthar. ${owner} inherits everything they held (+${info.g} Gold, +${info.d} Doll${info.d===1?'':'s'}, +${info.s} Sacred Line${info.s===1?'':'s'}), and ${drawer}'s remaining ${info.discardedCount} card${info.discardedCount===1?'':'s'} ${info.discardedCount===1?'is':'are'} discarded.`, true);
  finishResolution();
}

/* Human's own choice when THEY are the row OWNER of a Burglar (i.e. it's
   their Burglar that just struck). resourceKey is 'gold' | 'dolls' | 'sacredLines'. */
function resolveBurglar_steal(resourceKey){
  const p = S.pending; const { drawer, owner } = p;
  if (S[resourceKey][drawer] > 0){
    S[resourceKey][drawer] -= 1;
    S[resourceKey][owner] += 1;
    logMsg(`${owner}'s Burglar strikes! Steals 1 ${RESOURCE_LABEL[resourceKey]} from ${drawer}.`);
  }
  finishResolution();
}
function resolveBurglar_wasted(){
  const p = S.pending; const { drawer, owner } = p;
  logMsg(`${owner}'s Burglar strikes, but ${drawer} has nothing worth stealing — the attempt is wasted.`);
  finishResolution();
}

/* Eliminate `drawer`: `owner` (whoever's Hasthar caused it) inherits all
   of the drawer's Gold Coins, Flour Dolls and Sacred Lines, and any of
   the drawer's own row cards that hadn't been drawn yet are discarded
   immediately rather than staying in play. Eliminated players never
   take another turn and never receive a fresh row again (see
   refillEmptyRows()). Returns the transferred amounts for messaging. */
function eliminatePlayer(drawer, owner){
  const g = S.gold[drawer], d = S.dolls[drawer], s = S.sacredLines[drawer];
  S.gold[owner] += g; S.dolls[owner] += d; S.sacredLines[owner] += s;
  S.gold[drawer] = 0; S.dolls[drawer] = 0; S.sacredLines[drawer] = 0;
  S.status[drawer] = 'eliminated';

  let discardedCount = 0;
  const row = S.rows[drawer];
  const consumed = S.consumed[drawer];
  row.forEach((cardType, idx) => {
    if (!consumed[idx]){
      S.discard.push(cardType);
      consumed[idx] = true;
      discardedCount++;
    }
  });

  return { g, d, s, discardedCount };
}
/* Human acknowledging an already-applied Burglar/Goddess outcome. */
function acknowledgeResolution(){
  logMsg(S.pending.outcomeMsg);
  finishResolution();
}

function finishResolution(){
  if (!S.pending) return; // already resolved (defensive guard against double-calls)
  const { owner, idx } = S.pending;
  const cardType = S.rows[owner][idx];
  S.consumed[owner][idx] = true;
  S.discard.push(cardType);
  S.drawCount = (S.drawCount || 0) + 1;
  S.drawnCounts[cardType] = (S.drawnCounts[cardType] || 0) + 1;
  S.pending = null;
  refillEmptyRows();
  advanceTurn();
}

/* Whenever a player's row has had every one of its cards drawn, deal
   them a fresh row of up to 5 cards pulled at random from the discard
   pile (cards already resolved elsewhere in the game). Checked for
   every player each time, so a row starved earlier (not enough cards
   yet in the discard pile) gets picked up again as soon as there's
   enough to deal. */
function refillEmptyRows(){
  S.players.forEach(owner => {
    if (S.status[owner] === 'eliminated') return; // eliminated players never get fresh cards
    const row = S.rows[owner];
    const rowEmpty = row.length === 0 || S.consumed[owner].every(c => c);
    if (!rowEmpty) return;
    const n = Math.min(5, S.discard.length);
    if (n === 0) return;
    shuffle(S.discard);
    const newCards = S.discard.splice(0, n);
    S.rows[owner] = newCards;
    S.consumed[owner] = newCards.map(() => false);
    logMsg(`${owner}'s row ran empty — ${n} card${n === 1 ? '' : 's'} reshuffled back in from the discard pile.`, true);
  });
}

/* ===================== MARKET ===================== */
const MARKET_COST = 2;
/* The human player only, at any point during their own turn (whether or
   not they've already drawn), can spend Gold Coins to buy a Flour Doll or
   a Sacred Line. This does not use up their turn — they can still draw
   afterwards. kind is 'dolls' | 'sacredLines'. */
function buyResource(kind){
  const active = S.players[S.turnIndex];
  if (active !== S.human || S.status[active] !== 'active' || S.pending) return;
  if (S.gold[S.human] < MARKET_COST) return;
  S.gold[S.human] -= MARKET_COST;
  S[kind] = S[kind] || {};
  S[kind][S.human] += 1;
  logMsg(`${S.human} spends ${MARKET_COST} Gold Coins at the market for 1 ${RESOURCE_LABEL[kind]}.`);
  render();
}

function toggleLog(show){ S.showLog = show; render(); }

function slotHtml(owner, idx){
  const isConsumed = S.consumed[owner][idx];
  if (isConsumed) return `<div class="slot empty-slot"></div>`;

  const pending = S.pending;
  const isPickTarget = pending && pending.owner === owner && pending.idx === idx;

  if (isPickTarget && pending.phase === 'highlight'){
    return `<div class="slot picking"><img src="${BACK_IMG}"></div>`;
  }
  if (isPickTarget && pending.phase === 'revealed'){
    return `<div class="slot just-resolved"><img src="${CARD_IMG[pending.card]}"></div>`;
  }

  // Player 1's own row is always visible (face up); no memorizing needed.
  if (owner === S.human){
    return `<div class="slot own-card"><img src="${CARD_IMG[S.rows[owner][idx]]}"></div>`;
  }

  // Other rows are face down. If it's the human's turn and this slot is a
  // legal target, make it clickable.
  const active = S.players[S.turnIndex];
  const canPick = !S.pending && active === S.human && S.status[active] === 'active';
  if (canPick){
    return `<div class="slot selectable" onclick="humanChooseTarget('${owner}', ${idx})"><img src="${BACK_IMG}"></div>`;
  }
  return `<div class="slot"><img src="${BACK_IMG}"></div>`;
}

/* ===================== GAME LOG: STATS TABLE + GOLD CHART ===================== */
/* Fixed by player name (not board position) so colors stay consistent
   across every game archived this session — every game always has the
   same three player names. */
const PLAYER_COLOR = { 'Player 1': '#3987e5', 'Player 2': '#d95926', 'Player 3': '#199e70' };

function statsTableHtml(){
  const dc = S.deckCounts || {};
  const dn = S.drawnCounts || {};
  const sumGold = S.players.reduce((s, p) => s + S.gold[p], 0);
  const sumDolls = S.players.reduce((s, p) => s + S.dolls[p], 0);
  const sumLines = S.players.reduce((s, p) => s + S.sacredLines[p], 0);
  return `
    <table class="final-table stats-table">
      <tr><th>Players</th><th>Hasthar</th><th>Burglar</th><th>Goddess</th><th>Gold Coins</th><th>Flour Dolls</th><th>Sacred Lines</th></tr>
      <tr>
        <td>${S.numPlayers}</td>
        <td>${dn.Hasthar || 0} / ${dc.Hasthar || 0} drawn</td>
        <td>${dn.Burglar || 0} / ${dc.Burglar || 0} drawn</td>
        <td>${dn.Goddess || 0} / ${dc.Goddess || 0} drawn</td>
        <td>${sumGold} in play</td>
        <td>${sumDolls} in play</td>
        <td>${sumLines} in play</td>
      </tr>
    </table>`;
}

const ALL_PLAYERS = ['Player 1', 'Player 2', 'Player 3'];

/* A small self-contained SVG scatter chart: total turns taken in a game
   (x) vs. each SURVIVING player's final Gold Coin count (y) — one dot
   per survivor, added only once a game actually finishes, so the chart
   grows by a fresh row of dots every time a game is completed. Eliminated
   players are left out entirely. Dots rather than lines, since separate
   games have nothing connecting them. No external charting library — the
   file has to keep working standalone if someone else opens it. */
function goldScatterSvg(){
  const points = [];
  let maxTurn = 1, maxGold = 2;
  gameArchive.forEach(g => {
    g.survivors.forEach(p => {
      const gold = g.finalGold[p];
      if (typeof gold !== 'number') return;
      points.push({ turn: g.turns, gold, player: p });
      if (g.turns > maxTurn) maxTurn = g.turns;
      if (gold > maxGold) maxGold = gold;
    });
  });
  if (points.length === 0){
    return `<div class="chart-empty">No completed games yet this session — a game adds its dots here once it finishes.</div>`;
  }
  maxGold = Math.max(2, Math.ceil(maxGold / 2) * 2);

  const W = 640, H = 280, ML = 40, MR = 16, MT = 14, MB = 34;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const xPos = t => ML + (t / maxTurn) * plotW;
  const yPos = g => MT + plotH - (g / maxGold) * plotH;

  const Y_TICKS = 4;
  let gridSvg = '';
  for (let i = 0; i <= Y_TICKS; i++){
    const gv = Math.round((maxGold / Y_TICKS) * i);
    const yy = yPos(gv);
    gridSvg += `<line x1="${ML}" y1="${yy}" x2="${W - MR}" y2="${yy}" class="chart-grid"/>`;
    gridSvg += `<text x="${ML - 8}" y="${yy + 4}" class="chart-tick" text-anchor="end">${gv}</text>`;
  }
  const X_TICKS = Math.min(maxTurn, 8);
  let xTickSvg = '';
  for (let i = 0; i <= X_TICKS; i++){
    const tv = Math.round((maxTurn / X_TICKS) * i);
    const xx = xPos(tv);
    xTickSvg += `<text x="${xx}" y="${H - MB + 18}" class="chart-tick" text-anchor="middle">${tv}</text>`;
  }

  const dotsSvg = points.map(pt =>
    `<circle cx="${xPos(pt.turn)}" cy="${yPos(pt.gold)}" r="5" fill="${PLAYER_COLOR[pt.player] || '#999'}" fill-opacity="0.72"/>`
  ).join('');

  const legendHtml = ALL_PLAYERS.map(p => `
    <span class="chart-legend-item">
      <span class="chart-swatch" style="background:${PLAYER_COLOR[p]}"></span>${p}${p === 'Player 1' ? ' (you)' : ' (computer)'}
    </span>`).join('');

  return `
    <div class="chart-wrap">
      <div class="chart-title">TOTAL TURNS VS. FINAL GOLD COINS (SURVIVORS ONLY) — ${gameArchive.length} GAME${gameArchive.length === 1 ? '' : 'S'} PLAYED</div>
      <svg viewBox="0 0 ${W} ${H}" class="gold-chart" role="img" aria-label="Each finished game's total turns against each surviving player's final Gold Coin count">
        ${gridSvg}
        <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" class="chart-axis"/>
        <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" class="chart-axis"/>
        ${xTickSvg}
        ${dotsSvg}
        <text x="${ML + plotW / 2}" y="${H - 2}" class="chart-axis-label" text-anchor="middle">Turns in the game</text>
      </svg>
      <div class="chart-legend">${legendHtml}</div>
    </div>`;
}

function resolutionPanelHtml(){
  const p = S.pending;
  const { drawer, owner, card, phase } = p;

  if (phase === 'highlight'){
    return `<div class="turn-banner">A card is being drawn from ${owner}'s row...</div>`;
  }

  let title = '', body = '', buttons = '';
  const humanIsDrawer = isHuman(drawer);
  const humanIsOwner = isHuman(owner);

  if (card === 'Hasthar' && humanIsDrawer){
    title = 'HASTHAR!';
    body = `${drawer} drew a Hasthar from ${owner}'s row. Face it now:`;
    const hasDoll = S.dolls[drawer] > 0;
    const hasLine = S.sacredLines[drawer] > 0;
    if (!hasDoll && !hasLine){
      body += `<br><br><strong style="color:var(--rust);">No Flour Doll and no Sacred Line available — there is no way to survive this.</strong>`;
      buttons = `<button class="big-btn danger" onclick="resolveHasthar_noProtection()">Continue</button>`;
    } else {
      buttons = `
        <button class="big-btn safe" ${hasDoll ? '' : 'disabled'} onclick="resolveHasthar_sacrifice()">Feed a Flour Doll → ${owner} gains 1 Gold Coin</button>
        <button class="big-btn gold" ${hasLine ? '' : 'disabled'} onclick="resolveHasthar_sacredLine()">Use Sacred Line (block entirely)</button>`;
    }
  } else if (card === 'Hasthar' && !humanIsDrawer){
    title = 'HASTHAR!';
    body = `${drawer} drew a Hasthar from ${owner}'s row.<br><br>${p.outcomeMsg}`;
    buttons = `<div class="ai-thinking">...</div>`;
  } else if (card === 'Burglar' && humanIsOwner){
    title = 'BURGLAR!';
    const hasGold = S.gold[drawer] > 0, hasDoll = S.dolls[drawer] > 0, hasLine = S.sacredLines[drawer] > 0;
    if (!hasGold && !hasDoll && !hasLine){
      body = `${drawer} triggered a Burglar hidden in your row — but they have nothing worth stealing. The attempt goes to waste.`;
      buttons = `<button class="big-btn gold" onclick="resolveBurglar_wasted()">Continue</button>`;
    } else {
      body = `${drawer} triggered a Burglar hidden in your row. Choose what to steal from them:`;
      buttons = `
        <button class="big-btn gold" ${hasGold ? '' : 'disabled'} onclick="resolveBurglar_steal('gold')">Steal 1 Gold Coin</button>
        <button class="big-btn gold" ${hasDoll ? '' : 'disabled'} onclick="resolveBurglar_steal('dolls')">Steal 1 Flour Doll</button>
        <button class="big-btn gold" ${hasLine ? '' : 'disabled'} onclick="resolveBurglar_steal('sacredLines')">Steal 1 Sacred Line</button>`;
    }
  } else if (card === 'Burglar' && !humanIsOwner){
    title = 'BURGLAR!';
    body = `${drawer} drew a Burglar from ${owner}'s row.<br><br>${p.outcomeMsg}`;
    buttons = `<div class="ai-thinking">...</div>`;
  } else if (card === 'Goddess'){
    title = 'GODDESS!';
    body = `${drawer} drew a Goddess from ${owner}'s row and is blessed.<br><br>${p.outcomeMsg}`;
    buttons = humanIsDrawer
      ? `<button class="big-btn gold" onclick="acknowledgeResolution()">Continue</button>`
      : `<div class="ai-thinking">...</div>`;
  }

  return `
    <div class="resolution-panel">
      <img class="reveal-card" src="${CARD_IMG[card]}">
      <div class="rp-title">${title}</div>
      <div class="rp-msg">${body}</div>
      ${buttons}
    </div>`;
}

function renderBoard(){
  const active = S.players[S.turnIndex];
  const humanTurn = active === S.human && !S.pending;

  const rowsHtml = S.players.map(p => {
    const isActive = p === active && !S.pending;
    const eliminated = S.status[p] === 'eliminated';
    const youTag = p === S.human ? ' (you)' : ' (computer)';
    return `
      <div class="row-panel ${isActive ? 'active-turn' : ''} ${eliminated ? 'eliminated-row' : ''}">
        <div class="rp-head">
          <div>
            <span class="rp-name">${p}${youTag}</span>
            ${eliminated ? '<span class="rp-tag eliminated">eliminated</span>' : ''}
            ${isActive ? '<span class="rp-tag you-turn">current turn</span>' : ''}
          </div>
          <div class="rp-res">
            <span class="val"><img src="${GOLD_IMG}">${S.gold[p]} Gold</span>
            <span class="val"><img src="${DOLL_IMG}">${S.dolls[p]} Doll${S.dolls[p]===1?'':'s'}</span>
            <span class="val">🛡 ${S.sacredLines[p]} Sacred Line${S.sacredLines[p]===1?'':'s'}</span>
          </div>
        </div>
        <div class="slots">
          ${S.rows[p].map((c, idx) => slotHtml(p, idx)).join('')}
        </div>
      </div>`;
  }).join('');

  let turnBannerHtml = '';
  let marketHtml = '';
  if (!S.pending){
    turnBannerHtml = humanTurn
      ? `<div class="turn-banner">Your turn — click a face-down card from another player's row</div>`
      : `<div class="turn-banner">${active}'s turn (computer)...</div>`;
    if (humanTurn){
      const canAfford = S.gold[S.human] >= MARKET_COST;
      marketHtml = `
        <div class="market-panel">
          <span class="market-label">Market — spend ${MARKET_COST} Gold Coins on:</span>
          <button class="big-btn small" ${canAfford ? '' : 'disabled'} onclick="buyResource('dolls')">Buy 1 Flour Doll</button>
          <button class="big-btn small" ${canAfford ? '' : 'disabled'} onclick="buyResource('sacredLines')">Buy 1 Sacred Line</button>
        </div>`;
    }
  }

  const controlsHtml = S.pending ? resolutionPanelHtml() : '';

  document.getElementById('app').innerHTML = `
    ${titleBanner(`${totalRemaining()} card${totalRemaining()===1?'':'s'} in play · ${S.discard.length} in the discard pile`)}
    ${turnBannerHtml}
    ${marketHtml}
    <div class="board">${rowsHtml}</div>
    ${controlsHtml}
    <div class="log-title">THE LEDGER</div>
    <div class="log" id="log">${S.log.map(l => `<div class="${l.marker ? 'turn-marker' : ''}">${l.msg}</div>`).join('')}</div>
    <div class="center" style="margin-top:20px;">
      <button class="big-btn" onclick="goToSetup()">⟲ New Game</button>
      <button class="big-btn" onclick="toggleRules(true)">Rules</button>
      <button class="big-btn" onclick="toggleLog(true)">Game Log</button>
    </div>
  `;
  const logEl = document.getElementById('log');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
}

function renderEnd(){
  let bannerText;
  if (Array.isArray(S.winner)){
    bannerText = `TIE — ${S.winner.join(' & ')} share the win with ${S.gold[S.winner[0]]} Gold Coins each`;
  } else {
    bannerText = S.winner === S.human
      ? `YOU WIN with ${S.gold[S.winner]} Gold Coins`
      : `${S.winner} WINS with ${S.gold[S.winner]} Gold Coins`;
  }
  document.getElementById('app').innerHTML = `
    ${titleBanner('Game Over')}
    <div class="winner-banner">${bannerText}</div>
    <table class="final-table">
      <tr><th>Player</th><th>Gold Coins</th><th>Flour Dolls</th><th>Sacred Lines</th><th>Status</th></tr>
      ${S.players.map(p => `
        <tr>
          <td>${p}${p===S.human?' (you)':''}</td><td>${S.gold[p]}</td><td>${S.dolls[p]}</td><td>${S.sacredLines[p]}</td>
          <td>${S.status[p] === 'eliminated' ? 'Eliminated' : 'Survived'}</td>
        </tr>`).join('')}
    </table>
    <div class="log-title">THE LEDGER</div>
    <div class="log">${S.log.map(l => `<div class="${l.marker ? 'turn-marker' : ''}">${l.msg}</div>`).join('')}</div>
    <div class="center" style="margin-top:20px;">
      <button class="big-btn gold" onclick="goToSetup()">⟲ New Game</button>
      <button class="big-btn" onclick="toggleLog(true)">Game Log</button>
    </div>
  `;
}

function renderRules(){
  document.getElementById('app').innerHTML = `
    ${titleBanner('How To Play')}

    <h3 class="section-h">SETUP</h3>
    <p class="rules-p">You play as Player 1 against two computer players. A shared pile of Burglar,
    Hasthar and Goddess cards (15 total, counts you choose) is shuffled and dealt 5 to each player.
    <strong>Your five cards stay face up on the board the whole game</strong> — no memorizing needed.
    The two computer players' rows stay face down the whole game. Every player also starts with a
    number of Sacred Lines, Gold Coins and Flour Dolls that you set at table setup.</p>

    <h3 class="section-h">TAKING A TURN</h3>
    <p class="rules-p">On <strong>your</strong> turn, click any face-down card belonging to another
    player — you're choosing blind, based on memory, bluffing and luck, since you can't see what's
    under it. On a <strong>computer player's</strong> turn, it draws a random face-down card from
    someone else's row automatically. Either way, watch for the green glow: that's the exact card
    about to be revealed.</p>

    <div class="rules-card-row">
      <img src="${CARD_IMG.Hasthar}">
      <div><strong style="color:var(--gold);">Hasthar</strong> — threatens whoever drew it (not the row
      owner), who must choose: feed Hasthar a Flour Doll, or spend a Sacred Line. Feeding a Doll survives
      it, but the 1 Gold Coin it's worth goes to the row <strong>owner</strong> (whose Hasthar it was) —
      not to the drawer. A Sacred Line blocks the threat entirely for free and is simply spent; nobody
      gains anything from it. With neither available, the drawer is <strong>eliminated</strong>: the row
      owner inherits every Gold Coin, Flour Doll and Sacred Line the eliminated player was holding, and
      any of the eliminated player's own unrevealed row cards are discarded immediately rather than
      staying in play. An eliminated player can no longer take turns and never receives a fresh row
      again. When a computer player draws Hasthar, it always prefers a free Sacred Line block if it has
      one.</div>
    </div>
    <div class="rules-card-row">
      <img src="${CARD_IMG.Burglar}">
      <div><strong style="color:var(--gold);">Burglar</strong> — the row <strong>owner</strong> (whose
      card it was) gets to choose what to steal from whoever drew it: 1 Gold Coin, 1 Flour Doll, or 1
      Sacred Line. If the drawer has none of the three, the Burglar's hand comes up empty and the attempt
      is simply wasted. A computer owner prefers stealing Gold Coins first, then a Sacred Line, then a
      Flour Doll.</div>
    </div>
    <div class="rules-card-row">
      <img src="${CARD_IMG.Goddess}">
      <div><strong style="color:var(--gold);">Goddess</strong> — blesses whoever drew it with +1 Sacred
      Line, +1 Gold Coin and +1 Flour Doll.</div>
    </div>

    <h3 class="section-h">THE MARKET</h3>
    <p class="rules-p">On your own turn, before or after drawing, you can spend ${MARKET_COST} Gold Coins
    at the market for 1 Flour Doll or 1 Sacred Line — as many times as you can afford. Buying doesn't use
    up your turn. Computer players don't currently use the market.</p>

    <h3 class="section-h">RUNNING OUT OF CARDS</h3>
    <p class="rules-p">Once every card in a <strong>still-active</strong> player's row has been drawn, that
    row doesn't just stay empty — on the next resolution they're dealt a fresh row of up to 5 random
    cards reshuffled back in from the <strong>discard pile</strong> (cards already resolved earlier in
    the game, wherever they came from). If the discard pile doesn't have enough cards yet, they get
    however many are available and are topped back up to 5 later once more cards are discarded. An
    <strong>eliminated</strong> player is the one exception — they never get a fresh row again.</p>

    <h3 class="section-h">GAME END &amp; WINNER</h3>
    <p class="rules-p">Because rows keep getting refilled, the game mostly ends when every player has
    been eliminated by Hasthar. Whoever holds the most Gold Coins at that point wins. As a safety net for
    very long games, the temple also settles the score after ${DRAW_HARD_CAP} card draws even if players
    are still standing.</p>

    <div class="assump-note">
      <strong>Note:</strong> this is an early build — a few rules (what happens with no protection
      against Hasthar, whether Gold Coins alone decide the winner, exactly how cautious the computer
      players should be) were design calls made to get a playable version on the table quickly. Play it,
      then say what to change.
    </div>

    <div class="center" style="margin-top:20px;">
      <button class="big-btn" onclick="toggleRules(false)">Back</button>
    </div>
  `;
}

/* The Game Log is where the bookkeeping lives — the current game's
   stats and the cross-game turns-vs-gold scatter — kept off the board
   entirely so the playing screen stays clean and the cards can be
   bigger. The move-by-move ledger stays ON the board/end screens, where
   the game is actually happening. Reachable from every screen; safe to
   open with no game in progress (falls back to just the archive/chart). */
function renderLog(){
  const hasCurrentGame = !!S.deckCounts;
  const inProgressNote = S.screen === 'board' ? ' (1 still in progress)' : '';
  document.getElementById('app').innerHTML = `
    ${titleBanner('Game Log')}
    <div class="log-title">GAMES PLAYED: ${gameArchive.length}${inProgressNote}</div>
    ${hasCurrentGame ? statsTableHtml() : `<div class="chart-empty">No game in progress right now.</div>`}
    ${goldScatterSvg()}
    <div class="center" style="margin-top:20px;">
      <button class="big-btn gold" onclick="toggleLog(false)">Back</button>
    </div>
  `;
}

function render(){
  if (S.showRules){ renderRules(); return; }
  if (S.showLog){ renderLog(); return; }
  if (S.screen === 'start'){ renderStart(); return; }
  if (S.screen === 'setup'){ renderSetup(); return; }
  if (S.screen === 'board'){ renderBoard(); return; }
  if (S.screen === 'end'){ renderEnd(); return; }
}

render();

</script>
</body>
</html>
