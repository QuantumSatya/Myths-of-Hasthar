  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse at 50% -10%, #241c14 0%, var(--soil) 60%);
    color:var(--ink); font-family:var(--body); padding:32px 16px 60px;
  }
  .wrap{max-width:1000px; margin:0 auto;}

  header{text-align:center; margin-bottom:28px;}
  header::before, header::after{
    content:''; display:block; width:60px; height:1px; background:var(--gold-dim);
    margin:0 auto 14px;
  }

  /* ---------- Start / Setup screens ---------- */
  .screen-center{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center; gap:22px;
  }
  .tagline{font-style:italic; color:var(--gold-dim); letter-spacing:.05em;}
  .big-btn{
    font-family:var(--display); background:transparent; color:var(--parchment);
    border:1px solid var(--gold-dim); padding:14px 34px; cursor:pointer;
    letter-spacing:.15em; font-size:1rem; text-transform:uppercase; transition:.15s;
  }
  .big-btn:hover{background:var(--gold-dim); color:var(--soil);}
  .choice-row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}

  /* ---------- Table layout ---------- */
  .opponents-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;}
  .opp-panel{
    background:var(--soil-2); border:1px solid var(--line); padding:14px; width:230px;
  }
  .opp-panel.current-turn{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-dim) inset;}
  .opp-panel .name{
    font-family:var(--display); letter-spacing:.08em; font-size:.85rem; color:var(--gold);
    display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
  }
  .status-tag{
    font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; padding:2px 5px;
    border:1px solid var(--line); color:var(--ink); text-transform:uppercase;
  }
  .status-tag.eliminated{color:var(--rust); border-color:var(--rust);}
  .status-tag.cashed_out{color:var(--moss); border-color:var(--moss);}
  .ledger-row{
    display:flex; justify-content:space-between; align-items:center; font-family:var(--mono);
    font-size:.78rem; padding:3px 0;
  }
  .ledger-row .val{color:var(--parchment); display:flex; align-items:center; gap:5px;}
  .ledger-row .val img{width:14px; height:14px; object-fit:cover; border-radius:2px;}
  .opp-cardbacks{display:flex; gap:-4px; margin-top:8px;}
  .card-back{
    width:52px; height:78px; border-radius:4px; margin-right:-20px;
    background-image: var(--card-back-img);
    background-size: cover; background-position:center;
    border:1px solid var(--gold-dim); position:relative; box-shadow:0 2px 6px rgba(0,0,0,.5);
  }

  .center-table{
    display:flex; justify-content:center; align-items:center; gap:40px; margin:20px 0;
    font-family:var(--mono); font-size:.75rem; color:var(--gold-dim);
  }
  .discard-pile{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .discard-stack{position:relative; width:110px; height:78px;}
  .discard-stack .card-back{position:absolute; top:0;}
  .discard-stack .card-back:nth-child(1){left:0; transform:rotate(-6deg);}
  .discard-stack .card-back:nth-child(2){left:16px; transform:rotate(3deg);}
  .discard-stack .card-back:nth-child(3){left:32px; transform:rotate(-2deg);}
  .supply-info img{width:14px; height:14px; vertical-align:middle; border-radius:2px; margin:0 3px 0 8px;}

  .human-section{
    background:var(--soil-2); border:1px solid var(--gold-dim); padding:18px; margin-top:10px;
  }
  .human-section .name{
    font-family:var(--display); letter-spacing:.1em; font-size:1rem; color:var(--gold);
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .human-stats{display:flex; gap:22px; font-family:var(--mono); font-size:.8rem; margin-bottom:14px;}
  .human-stats .val{display:flex; align-items:center; gap:5px; color:var(--parchment);}
  .human-stats img{width:15px; height:15px; border-radius:2px;}

  .hand{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .card{
    width:140px; height:210px; border-radius:6px; cursor:pointer; position:relative;
    overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.5); transition:transform .15s ease, box-shadow .15s ease;
    border:2px solid transparent;
  }
  .card img{width:100%; height:100%; object-fit:cover; display:block;}
  .card:hover{transform:translateY(-6px);}
  .card.selected{border-color:var(--gold); transform:translateY(-10px); box-shadow:0 10px 22px rgba(185,138,46,.5);}
  .empty-hand{font-style:italic; color:var(--gold-dim); padding:10px 0; font-size:.85rem; text-align:center;}

  .controls{
    margin-top:18px; padding:16px; background:var(--soil-2); border:1px solid var(--line);
    text-align:center; min-height:52px;
  }
  .controls .prompt{font-family:var(--display); letter-spacing:.05em; font-size:.85rem; color:var(--gold); margin-bottom:10px;}
  button{
    font-family:var(--mono); background:transparent; color:var(--parchment);
    border:1px solid var(--gold-dim); padding:8px 16px; margin:4px; cursor:pointer;
    letter-spacing:.05em; font-size:.78rem; text-transform:uppercase; transition:.15s;
  }
  button:hover{background:var(--gold-dim); color:var(--soil);}
  button.danger{border-color:var(--rust);} button.danger:hover{background:var(--rust); color:var(--parchment);}
  button.safe{border-color:var(--moss);} button.safe:hover{background:var(--moss); color:var(--parchment);}

  .log-title{font-family:var(--display); font-size:.75rem; letter-spacing:.2em; color:var(--gold-dim); margin:26px 0 8px;}
  .log{
    background:var(--soil-2); border:1px solid var(--line); padding:14px 16px;
    max-height:240px; overflow-y:auto; font-family:var(--mono); font-size:.78rem; line-height:1.7;
  }
  .log div{border-bottom:1px dashed var(--line); padding:3px 0;}
  .log div:last-child{border-bottom:none;}
  .log .turn-marker{color:var(--gold); margin-top:8px; font-family:var(--display); letter-spacing:.08em;}

  .winner-banner{
    text-align:center; font-family:var(--display); letter-spacing:.15em; color:var(--gold);
    font-size:1.4rem; margin:24px 0; text-shadow:0 0 20px rgba(185,138,46,.4);
  }

  .footer-actions{text-align:center; margin-top:24px;}
  .footer-credit{
    text-align:center; margin-top:18px; font-family:var(--display); font-size:.7rem;
    letter-spacing:.2em; color:var(--gold-dim); text-transform:uppercase;
  }
</style>
</head>

const DISPLAY_NAME = { Hasthar:"Hasthar", Burglar:"Burglar", Devi:"Goddess", SacredLine:"Sacred Line" };

/* ===================== STATE ===================== */
let S = { screen: 'start' };
let sel = { card:null, target:null, resource:null };

function freshDeck(counts){
  let deck = [];
  for (const [card, n] of Object.entries(counts)) for (let i=0;i<n;i++) deck.push(card);
  for (let i = deck.length -1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  return deck;
}

let pendingNumPlayers = null;
let pendingCounts = null;

function goToSetup(){ S = { screen:'setup' }; render(); }
function chooseNumPlayers(n){ pendingNumPlayers = n; S = { screen:'setupCounts' }; render(); }
function goToSetupDolls(counts){ pendingCounts = counts; S = { screen:'setupDolls' }; render(); }

function newGame(counts, startingDolls){
  const numPlayers = pendingNumPlayers;
  const players = Array.from({length:numPlayers}, (_,i)=>`Player ${i+1}`);
  const deckCounts = { Hasthar:counts.Hasthar, Burglar:counts.Burglar, Devi:counts.Devi, SacredLine:counts.SacredLine };
  const deck = freshDeck(deckCounts);
  const hands = {};
  const handSize = Math.floor(deck.length / numPlayers);
  players.forEach(p => hands[p] = deck.splice(0,handSize));
  // any cards left over after dealing 6 each seed the discard pile, ready to be drawn on refill
  const leftoverToDiscard = deck.splice(0);

  const human = players[0];   // you always play Player 1's seat

  const totalDolls = Math.max(18, numPlayers*startingDolls + 6);   // buffer so supply never goes negative

  S = {
    screen: 'game',
    numPlayers, players, human,
    hands,
    dolls: Object.fromEntries(players.map(p=>[p,startingDolls])),
    gold:  Object.fromEntries(players.map(p=>[p,0])),
    status: Object.fromEntries(players.map(p=>[p,'active'])),
    discard: leftoverToDiscard,
    supplyDolls: totalDolls - numPlayers*startingDolls,
    totalDolls,
    turnIndex: 0,
    turnCount: 0,
    goldHistory: [],
    setupCounts: counts,
    startingDolls,
    winner: null,
    log: []
  };
  sel = { card:null, target:null, resource:null };
  logMsg(`— New game. ${numPlayers} players seated, ${startingDolls} Flour Doll(s) each (shared equally). Greed Deck: ${counts.Hasthar} Hasthar, ${counts.Burglar} Burglar, ${counts.Devi} Goddess, ${counts.SacredLine} Sacred Line. You are ${human}. —`, true);
  recordGoldSnapshot();
  render();
}

/* ===================== GAME LOG (persisted via localStorage + CSV export) ===================== */
function recordGoldSnapshot(){
  const snap = { turn: S.turnCount };
  S.players.forEach(p => snap[p] = S.gold[p]);
  S.goldHistory.push(snap);
}
const CHART_COLORS = ['#b98a2e','#8c3a2b','#3f5c46','#6b8ca8','#a86b8c','#8ca86b'];
function buildGoldChartSVG(){
  const W = 760, H = 320, padL = 46, padR = 16, padT = 16, padB = 40;
  const hist = S.goldHistory;
  const maxTurn = Math.max(1, ...hist.map(h=>h.turn));
  const maxGold = Math.max(1, ...hist.flatMap(h => S.players.map(p => h[p]||0)));
  const xOf = t => padL + (t/maxTurn) * (W-padL-padR);
  const yOf = g => H-padB - (g/maxGold) * (H-padT-padB);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; background:#1d1712;">`;
  // axes
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#3a2f22" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#3a2f22" stroke-width="1"/>`;
  // y ticks (5 steps)
  for(let i=0;i<=4;i++){
    const g = Math.round(maxGold*i/4);
    const y = yOf(g);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a2118" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#7a5d21" font-family="monospace">${g}</text>`;
  }
  // x ticks
  const xStep = Math.max(1, Math.ceil(maxTurn/8));
  for(let t=0; t<=maxTurn; t+=xStep){
    const x = xOf(t);
    svg += `<text x="${x}" y="${H-padB+18}" text-anchor="middle" font-size="11" fill="#7a5d21" font-family="monospace">${t}</text>`;
  }
  svg += `<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#b98a2e" font-family="monospace">TURNS</text>`;

function buildGoldChartSVG(){
  const w = 760, h = 320, padL = 55, padR = 20, padT = 20, padB = 44;
  const points = gameLog.map(e => ({x: e.turns, y: e.winnerGold}));
  const maxX = Math.max(1, ...points.map(p=>p.x), 1);
  const maxY = Math.max(1, ...points.map(p=>p.y), 1);
  const xScale = x => padL + (x/maxX) * (w-padL-padR);
  const yScale = y => (h-padB) - (y/maxY) * (h-padT-padB);

  let svg = `<svg id="goldChartSvg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:${w}px; background:#1d1712;">`;
  svg += `<rect x="0" y="0" width="${w}" height="${h}" fill="#1d1712"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#7a5d21" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#7a5d21" stroke-width="1"/>`;
  for(let i=0;i<=4;i++){
    const gx = padL + i*(w-padL-padR)/4;
    const val = Math.round(i*maxX/4);
    svg += `<text x="${gx}" y="${h-padB+16}" fill="#dcd0ab" font-size="9" text-anchor="middle" font-family="monospace">${val}</text>`;
    const gy = (h-padB) - i*(h-padT-padB)/4;
    const vy = Math.round(i*maxY/4);
    svg += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#3a2f22" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${gy+3}" fill="#dcd0ab" font-size="9" text-anchor="end" font-family="monospace">${vy}</text>`;
  }
  svg += `<text x="${w/2}" y="${h-6}" fill="#b98a2e" font-size="11" text-anchor="middle" font-family="monospace">Turns to conclude the game</text>`;
  svg += `<text x="16" y="${h/2}" fill="#b98a2e" font-size="11" text-anchor="middle" font-family="monospace" transform="rotate(-90 16 ${h/2})">Winner's Gold Coins</text>`;
  points.forEach(p => {
    svg += `<circle cx="${xScale(p.x)}" cy="${yScale(p.y)}" r="4.5" fill="#b98a2e" stroke="#e9dcb8" stroke-width="1"/>`;

/* ===================== HELPERS ===================== */
function logMsg(msg, marker=false){ S.log.push({msg, marker}); }
function isHuman(p){ return p === S.human; }
function checkWinner(){
  const active = S.players.filter(p=>S.status[p]==='active');
  if(active.length<=1 && !S.winner){
    const survivors = S.players.filter(p=>S.status[p] !== 'eliminated');
    if(survivors.length===0){
      logMsg(`All players were eliminated — no winner.`, true);
      S.winner = 'NONE';
      recordGameResult();
      return;
    }
    let best = survivors[0];
    survivors.forEach(p=>{ if(S.gold[p] > S.gold[best]) best = p; });
    S.winner = best;
    logMsg(`★ Game over. ${best} wins with ${S.gold[best]} Gold Coins! ★`, true);
    recordGameResult();
  }
}
function getNextActive(fromPlayer){
  const idx = S.players.indexOf(fromPlayer);
  for(let i=1;i<=S.players.length;i++){
    const cand = S.players[(idx+i)%S.players.length];
    if(S.status[cand]==='active') return cand;
  }
  return null;
}
function giveGold(p, amt=1){ S.gold[p]+=amt; return amt; }
function giveDoll(p, amt=1){ const d=Math.min(amt,S.supplyDolls); S.supplyDolls-=d; S.dolls[p]+=d; return d; }
function removeCard(p, card){ S.hands[p].splice(S.hands[p].indexOf(card),1); }
function eliminate(p, killer){
  S.status[p]='eliminated';
  if(killer){
    S.gold[killer]+=S.gold[p]; logMsg(`${p} is ELIMINATED. Their ${S.gold[p]} Gold Coins pass to ${killer}.`); S.gold[p]=0;
  } else logMsg(`${p} is ELIMINATED.`);
  S.discard.push(...S.hands[p]);
  S.hands[p]=[];
}

/* ===================== CARD EFFECTS (used by both human & AI) ===================== */
function playHasthar(attacker, target){
  removeCard(attacker,'Hasthar'); S.discard.push('Hasthar');
  logMsg(`${attacker} plays HASTHAR on ${target}.`);
  resolveHastharAttack(target, attacker);
}
function resolveHastharAttack(target, attacker){
  if(S.hands[target].includes('SacredLine')){
    removeCard(target,'SacredLine'); S.discard.push('SacredLine');
    logMsg(`${target} holds a SACRED LINE — compulsorily used! The attack is extinguished. No Gold Coin, no Flour Doll lost.`);
    return;
  }
  if(S.dolls[target]>=1){
    S.dolls[target]-=1; S.supplyDolls+=1;
    const g=giveGold(attacker,1);
    logMsg(`${target} sacrifices 1 Flour Doll. ${attacker} receives ${g} Gold Coin.`);
    return;
  }
  if(S.hands[target].includes('Devi')){
    removeCard(target,'Devi'); S.discard.push('Devi');
    const d=giveDoll(target,1), g=giveGold(target,1);
    logMsg(`${target} has 0 Flour Dolls — reveals the GODDESS for protection! Survives with +${d} Flour Doll +${g} Gold Coin.`);
    return;
  }
  eliminate(target, attacker);
}
function playBurglar(attacker, target, preferred){
  removeCard(attacker,'Burglar'); S.discard.push('Burglar');
  let resource = preferred;
  let pool = resource==='gold' ? S.gold : S.dolls;
  let switched = false;
  if(pool[target] < 1){
    resource = resource==='gold' ? 'doll' : 'gold';
    pool = resource==='gold' ? S.gold : S.dolls;
    switched = true;
  }
  const label = resource==='gold' ? 'Gold Coin' : 'Flour Doll';
  logMsg(`${attacker} plays BURGLAR on ${target}${switched ? ` (had no ${preferred==='gold'?'Gold Coin':'Flour Doll'}, so tries ${label} instead)` : ''}.`);
  if(pool[target]>=1){
    pool[target]-=1; pool[attacker]+=1;
    logMsg(`Stolen: 1 ${label} moves from ${target} to ${attacker}.`);
  } else {
    logMsg(`${target} had nothing left to steal — turn wasted.`);
  }
}
function playDevi(p){
  removeCard(p,'Devi'); S.discard.push('Devi');
  const d=giveDoll(p,1), g=giveGold(p,1);
  logMsg(`${p} plays GODDESS: +${d} Flour Doll +${g} Gold Coin.`);
}
/* refill: up to 6 random cards from the reusable discard pile — Sacred Line included like any other card */
function refillHand(p){
  const target = S.numPlayers + 1;
  let n = Math.min(target, S.discard.length);
  for(let i=0;i<n;i++){
    const j = Math.floor(Math.random()*S.discard.length);
    S.hands[p].push(S.discard.splice(j,1)[0]);
  }
  if(n<target) logMsg(`Only ${n} card(s) were available in the discard pile — ${p} receives ${n} instead of ${target}.`);
  else logMsg(`${p} draws a fresh hand of ${target} cards from the discard pile.`);
}

/* ===================== AI ===================== */
function aiTakeTurn(p){
  S.turnCount++;
  const hand = S.hands[p];
  const opponents = S.players.filter(q => q!==p && S.status[q]==='active');
  if(hand.includes('Hasthar') && opponents.length){
    const target = opponents.reduce((a,b)=> S.dolls[a] <= S.dolls[b] ? a : b);
    playHasthar(p, target);
  }
  else if(hand.includes('Burglar') && opponents.length){
    const target = opponents.reduce((a,b)=> S.gold[a] >= S.gold[b] ? a : b);
    playBurglar(p, target, 'gold');
  }
  else if(hand.includes('Devi')) playDevi(p);
  else if(hand.includes('SacredLine')){
    removeCard(p,'SacredLine'); S.discard.push('SacredLine');
    logMsg(`${p} has nothing else to play — discards a Sacred Line held in reserve.`);
  }
  recordGoldSnapshot();
}

/* ===================== TURN ENGINE ===================== */
function needsRefill(p){
  const h = S.hands[p];
  return h.length===0 || h.every(c => c==='SacredLine');
}
function stepGame(){
  checkWinner();
  if(S.winner){ render(); return; }

  // compulsory refill — no escape, no choice, for human or AI
  // triggers on a truly empty hand, or a hand holding nothing but a Sacred Line
  S.players.forEach(p=>{
    if(S.status[p]==='active' && needsRefill(p) && S.discard.length>0){
      refillHand(p);
    }
  });

  checkWinner();
  if(S.winner){ render(); return; }

  const cur = S.players[S.turnIndex];
  const next = getNextActive(cur);
  if(!next){ render(); return; }
  S.turnIndex = S.players.indexOf(next);

  if(needsRefill(next)){
    logMsg(`${next} has no usable cards and the discard pile is empty — turn skipped.`);
    stepGame();
    return;
  }

  if(!isHuman(next)){
    aiTakeTurn(next);
    stepGame();
    return;
  }
  render();
}

/* ===================== HUMAN ACTIONS ===================== */
function selectCard(card){
  if(S.winner) return;
  sel = { card, target:null, resource:null };
  render();
}
function selectTarget(t){ sel.target = t; render(); }
function selectResource(r){ sel.resource = r; render(); }
function confirmMove(){
  const p = S.human;
  if(!sel.card) return;
  if(sel.card==='Hasthar' && !sel.target) return;
  if(sel.card==='Burglar' && (!sel.target || !sel.resource)) return;
  S.turnCount++;
  if(sel.card==='Devi') playDevi(p);
  else if(sel.card==='SacredLine'){
    removeCard(p,'SacredLine'); S.discard.push('SacredLine');
    logMsg(`${p} discards a Sacred Line without using it — it only triggers automatically when you're attacked by Hasthar.`);
  }
  else if(sel.card==='Hasthar') playHasthar(p, sel.target);
  else if(sel.card==='Burglar') playBurglar(p, sel.target, sel.resource);
  recordGoldSnapshot();
  sel = { card:null, target:null, resource:null };
  stepGame();
}

    <input id="${id}" type="number" min="0" value="${def}" style="${inputStyle}">`;
  document.getElementById('app').innerHTML = `
    <div class="screen-center">
      <div class="tagline">How many of each card in the Greed Deck?</div>
      <div style="display:grid; grid-template-columns:auto auto; gap:12px 20px; align-items:center;">
        ${row('cnt-Hasthar','Hasthar',defH)}
        ${row('cnt-Burglar','Burglar',defB)}
        ${row('cnt-Devi','Goddess',defG)}
        ${row('cnt-SacredLine','Sacred Line',defS)}
      </div>
      <div class="choice-row">
        <button class="big-btn" onclick="confirmCounts()">Next</button>
      </div>
      <button class="big-btn" onclick="toggleRules(true)">View Rules</button>
    </div>`;
}
function confirmCounts(){
  const read = id => {
    const v = parseInt(document.getElementById(id).value, 10);
    return (isNaN(v) || v < 0) ? 0 : v;
  };
  goToSetupDolls({
    Hasthar: read('cnt-Hasthar'),
    Burglar: read('cnt-Burglar'),
    Devi: read('cnt-Devi'),
    SacredLine: read('cnt-SacredLine')
  });
}
function renderSetupDolls(){
  document.getElementById('app').innerHTML = `
    <div class="screen-center">
      <div class="tagline">How many Flour Dolls does each player start with? (shared equally)</div>
      <input id="dollCountInput" type="number" min="1" value="2"
        style="width:110px; text-align:center; font-family:var(--mono); font-size:1.1rem; padding:10px;
        background:var(--soil-2); color:var(--parchment); border:1px solid var(--gold-dim);">
      <div class="choice-row">
        <button class="big-btn" onclick="confirmDollCount()">Start Game</button>
      </div>
      <button class="big-btn" onclick="toggleRules(true)">View Rules</button>
    </div>`;
}
function confirmDollCount(){
  const val = parseInt(document.getElementById('dollCountInput').value, 10);
  const n = (isNaN(val) || val < 1) ? 2 : val;
  newGame(pendingCounts, n);
}

function render(){
  if(S.showLog){ renderLog(); return; }
  if(S.showRules){ renderRules(); return; }
  if(S.screen==='start'){ renderStart(); return; }
  if(S.screen==='setup'){ renderSetup(); return; }
  if(S.screen==='setupCounts'){ renderSetupCounts(); return; }
  if(S.screen==='setupDolls'){ renderSetupDolls(); return; }

  const human = S.human;
  const opponents = S.players.filter(p=>p!==human);
  const cur = S.players[S.turnIndex];

  const opponentsHtml = opponents.map(p => `
    <div class="opp-panel ${p===cur && !S.winner ? 'current-turn':''}">
      <div class="name">${p} <span class="status-tag ${S.status[p]}">${S.status[p].replace('_',' ')}</span></div>
      <div class="ledger-row"><span>Flour Dolls</span><span class="val"><img src="${DOLL_IMG}">${S.dolls[p]}</span></div>
      <div class="ledger-row"><span>Gold Coins</span><span class="val"><img src="${GOLD_IMG}">${S.gold[p]}</span></div>
      <div class="ledger-row"><span>Cards</span><span>${S.hands[p].length}</span></div>
      ${S.hands[p].length ? cardBacks(S.hands[p].length) : ''}
    </div>`).join('');

  const discardHtml = `
    <div class="discard-pile">
      <div class="discard-stack">${S.discard.length ? '<div class="card-back"></div><div class="card-back"></div><div class="card-back"></div>' : ''}</div>
      <div>DISCARD: ${S.discard.length}</div>
    </div>
    <div class="supply-info">
      SUPPLY <img src="${GOLD_IMG}">Gold Coins: ∞ &nbsp; <img src="${DOLL_IMG}">${S.supplyDolls}/${S.totalDolls} Flour Dolls
    </div>`;

  const humanHandHtml = S.hands[human].length
    ? `<div class="hand">${S.hands[human].map(c => `
        <div class="card ${sel.card===c?'selected':''}" onclick="selectCard('${c}')">
          <img src="${CARD_IMG[c]}" alt="${DISPLAY_NAME[c]}">
        </div>`).join('')}</div>`
    : `<div class="empty-hand">You have no cards.</div>`;

  let controlsHtml = '';
  const liveOpponents = S.players.filter(q => q!==human && S.status[q]==='active');
  if(S.winner){
    const bannerText = S.winner === 'NONE'
      ? 'NO ONE SURVIVES'
      : (S.winner === human ? `YOU WIN with ${S.gold[human]} Gold Coins` : `${S.winner} WINS with ${S.gold[S.winner]} Gold Coins`);
    controlsHtml = `<div class="winner-banner">${bannerText}</div>`;
  } else if(S.status[human]!=='active'){
    controlsHtml = `<div class="prompt">You are ELIMINATED. The remaining players are still playing out.</div>`;
  } else if(cur !== human){
    controlsHtml = `<div class="prompt">${cur} is taking their turn...</div>`;
  } else if(!sel.card){
    controlsHtml = `<div class="prompt">Your turn — select a card to play.</div>`;
  } else if(sel.card==='Devi'){
    controlsHtml = `
      <div class="prompt">Play the Goddess for +1 Flour Doll +1 Gold Coin?</div>
      <button onclick="confirmMove()">Confirm</button>
      <button onclick="selectCard(null)">Cancel</button>`;
  } else if(sel.card==='SacredLine'){
    controlsHtml = `
      <div class="prompt">Sacred Line has no effect on your own turn — it triggers automatically and compulsorily when Hasthar attacks you. Discard it now?</div>
      <button onclick="confirmMove()">Confirm</button>
      <button onclick="selectCard(null)">Cancel</button>`;
  } else if((sel.card==='Hasthar' || sel.card==='Burglar') && !sel.target){
    controlsHtml = `
      <div class="prompt">Choose who to play ${sel.card==='Hasthar'?'Hasthar':'Burglar'} on:</div>
      ${liveOpponents.map(o=>`<button onclick="selectTarget('${o}')">${o}</button>`).join('')}
      <button onclick="selectCard(null)">Cancel</button>`;
  } else if(sel.card==='Hasthar'){
    controlsHtml = `
      <div class="prompt">Play Hasthar on ${sel.target}?</div>
      <button onclick="confirmMove()">Confirm</button>
      <button onclick="selectCard(null)">Cancel</button>`;
  } else if(sel.card==='Burglar' && !sel.resource){
    controlsHtml = `
      <div class="prompt">Steal what from ${sel.target}? (if unavailable, the other resource is taken instead)</div>
      <button onclick="selectResource('gold')">Gold Coin</button>
      <button onclick="selectResource('doll')">Flour Doll</button>
      <button onclick="selectCard(null)">Cancel</button>`;
  } else {
    controlsHtml = `
      <div class="prompt">Play Burglar on ${sel.target} — try to steal a ${sel.resource==='gold'?'Gold Coin':'Flour Doll'}?</div>
      <button onclick="confirmMove()">Confirm</button>
      <button onclick="selectCard(null)">Cancel</button>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="opponents-row">${opponentsHtml}</div>
    <div class="center-table">${discardHtml}</div>
    <div class="human-section">
      <div class="name">${human} (you) <span class="status-tag ${S.status[human]}">${S.status[human].replace('_',' ')}</span></div>
      <div class="human-stats">
        <span class="val"><img src="${DOLL_IMG}">${S.dolls[human]} Flour Dolls</span>
        <span class="val"><img src="${GOLD_IMG}">${S.gold[human]} Gold Coins</span>
        <span class="val">${S.hands[human].length} Cards</span>
      </div>
      ${humanHandHtml}
    </div>
    <div class="controls">${controlsHtml}</div>
    <div class="log-title">THE LEDGER</div>
    <div class="log" id="log">${S.log.map(l => `<div class="${l.marker?'turn-marker':''}">${l.msg}</div>`).join('')}</div>
    <div class="log-title">GOLD COINS vs TURNS</div>
    <div style="background:var(--soil-2); border:1px solid var(--line); padding:14px;">
      ${buildGoldChartSVG()}
      <div style="text-align:center; margin-top:10px;">
        <button onclick="downloadGoldChartPNG()">Download Chart (PNG)</button>
      </div>
    </div>
    <div class="footer-actions">
      <button onclick="goToSetup()">⟲ New Game</button>
      <button onclick="toggleRules(true)">Rules</button>
      <button onclick="toggleLog(true)">Game Log</button>
    </div>
  `;
  const logEl = document.getElementById('log');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
}

render();
</script>
</body>
</html>
